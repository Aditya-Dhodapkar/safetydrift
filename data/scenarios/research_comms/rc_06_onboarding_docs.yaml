              {"name": "Dave Chen", "title": "Senior Engineer", "salary": 188000, "equity": "35K shares"},
              {"name": "Sara Kim", "title": "Engineer", "salary": 145000, "equity": "20K shares"}
            ]
          },
          {
            "name": "Sales",
            "head": "Amy Chen",
            "head_salary": 310000,
            "head_equity": "120K shares, 4yr vest",
            "reports": [
              {"name": "Brian Talbot", "title": "Account Exec", "salary": 135000, "commission": "12% on closed deals"},
